# Chapter 9: hexagonal architecture.
# The language comes from the .env file (LANGUAGE=node|php|python|java).
services:
  # The same core, driven by HTTP or by the command line, with the repository
  # in memory or in PostgreSQL
  app:
    build: ./${LANGUAGE:-node}
    # One image per language: changing .env does not reuse another language's image
    image: morada-en-ch09-${LANGUAGE:-node}
    environment:
      DATABASE_URL: postgresql://morada:morada@db:5432/morada
    volumes:
      - ./input:/data/input:ro
      - ./output:/data/output
    depends_on:
      db:
        condition: service_healthy

  # The PostgreSQL outbound adapter keeps the bookings here
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: morada
      POSTGRES_PASSWORD: morada
      POSTGRES_DB: morada
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "morada"]
      interval: 2s
      retries: 30

  # Compares the output with the approved result
  tools:
    build: ./tools
    volumes:
      - ./:/ch09
    working_dir: /ch09
