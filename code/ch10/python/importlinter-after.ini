# Architecture test: the boundary rules between the modules of the monolith.
[importlinter]
root_package = morada

[importlinter:contract:bookings]
name = Bookings only uses the public API of Billing
type = forbidden
source_modules = morada.after.modules.bookings
forbidden_modules = morada.after.modules.billing.internal
# The Billing API uses its own table: that is allowed; the direct shortcut is not
allow_indirect_imports = True

[importlinter:contract:billing]
name = Billing does not depend on Bookings
type = forbidden
source_modules = morada.after.modules.billing
forbidden_modules = morada.after.modules.bookings
