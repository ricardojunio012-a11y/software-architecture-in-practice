# Architecture test: the boundary rules between the modules of the monolith.
deptrac:
  paths:
    - ./src/after
  layers:
    - name: Bookings
      collectors:
        - type: directory
          value: src/after/modules/bookings/.*
    - name: BillingApi
      collectors:
        - type: directory
          value: src/after/modules/billing/api.php
    - name: BillingInternal
      collectors:
        - type: directory
          value: src/after/modules/billing/internal/.*
  ruleset:
    # Bookings may use only the public API of Billing, never its table
    Bookings:
      - BillingApi
    BillingApi:
      - BillingInternal
    BillingInternal: ~
