# The lab's load balancer: round robin across three API replicas.
# A single worker process, so the distribution of requests is predictable in the lab.
worker_processes 1;
events {}

http {
  upstream api {
    # Passive health check: one connection failure takes the replica out for 30 s
    server api1:3000 max_fails=1 fail_timeout=30s;
    server api2:3000 max_fails=1 fail_timeout=30s;
    server api3:3000 max_fails=1 fail_timeout=30s;
  }

  server {
    listen 80;
    location / {
      proxy_pass http://api;
      # If the replica refuses the connection, the same request goes to the next one
      proxy_next_upstream error timeout;
      proxy_connect_timeout 1s;
    }
  }
}
