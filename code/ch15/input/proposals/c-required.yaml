# Proposal C: require the payment method in the request.
openapi: 3.1.0
info:
  title: Morada public API
  version: "1.0"
paths:
  /v1/communities/{community}/charges:
    get:
      operationId: listCharges
      summary: Lists a community's charges, in identifier order
      security:
        - managementCompany: ["charges:read"]
      parameters:
        - name: community
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [open, paid]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Value of "next" from the previous page
          schema:
            type: string
      responses:
        "200":
          description: A page of charges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargePage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/payments:
    post:
      operationId: recordPayment
      summary: Records the payment of a charge
      security:
        - managementCompany: ["payments:write"]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Request identifier, generated by the client; retrying is safe
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPayment"
      responses:
        "201":
          description: Payment recorded (or the same payment, on a retried request)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
components:
  schemas:
    Charge:
      type: object
      required: [id, unit, dueDate, amountCents, status]
      properties:
        id:
          type: string
        unit:
          type: string
        dueDate:
          type: string
          format: date
        amountCents:
          type: integer
        status:
          type: string
          enum: [open, paid]
    ChargePage:
      type: object
      required: [data, next]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Charge"
        next:
          type: [string, "null"]
    NewPayment:
      type: object
      required: [charge, amountCents, method]
      properties:
        charge:
          type: string
        amountCents:
          type: integer
          minimum: 1
        method:
          type: string
          enum: [card, ach]
    Payment:
      type: object
      required: [id, charge, amountCents, status]
      properties:
        id:
          type: string
        charge:
          type: string
        amountCents:
          type: integer
        status:
          type: string
          enum: [confirmed]
    Problem:
      description: Details of an error, in the RFC 9457 format
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
  responses:
    Problem:
      description: Error in the RFC 9457 format
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  securitySchemes:
    # OAuth 2.0 with client credentials: each management company has its own
    # credentials and asks for a token with only the scopes it needs
    managementCompany:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.morada.example/oauth/token
          scopes:
            "charges:read": Read the charges of the management company's communities
            "payments:write": Record payments of charges
