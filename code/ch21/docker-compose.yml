# Chapter 21: performance, latency, and load testing.
services:
  # Starts the board president's dashboard API and runs k6 against it
  app:
    build: ./node
    image: morada-en-ch21-node
    environment:
      DATABASE_URL: postgresql://morada:morada@db:5432/morada
    volumes:
      - ./sql:/data/sql:ro
      - ./output:/data/output
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: morada
      POSTGRES_PASSWORD: morada
      POSTGRES_DB: morada
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "morada"]
      interval: 2s
      retries: 30

  # Compares the output with the approved result
  tools:
    build: ./tools
    volumes:
      - ./:/ch21
    working_dir: /ch21
