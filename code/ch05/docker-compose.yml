# Chapter 5: design patterns.
# The language comes from the .env file (LANGUAGE=node|php|python|java).
services:
  # Processes the booking requests, or runs the tests of the chosen language
  app:
    build: ./${LANGUAGE:-node}
    # One image per language: changing .env does not reuse another language's image
    image: morada-en-ch05-${LANGUAGE:-node}
    environment:
      TODAY: ${TODAY:-2026-03-02}
    volumes:
      - ./input:/data/input:ro
      - ./output:/data/output

  # Compares the output with the approved result
  tools:
    build: ./tools
    volumes:
      - ./:/ch05
    working_dir: /ch05
