# Chapter 27: distributed systems fundamentals.
services:
  # The leader takes the writes
  primary:
    image: postgres:17-alpine
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=5"]
    environment:
      POSTGRES_USER: morada
      POSTGRES_PASSWORD: morada
      POSTGRES_DB: morada
    volumes:
      - ./db/primary.sh:/docker-entrypoint-initdb.d/primary.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "morada", "-h", "127.0.0.1"]
      interval: 2s
      retries: 30

  # The network between the leader and the replica goes through here, and the lab can
  # cut it
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./db/toxiproxy.json:/config/toxiproxy.json:ro
    depends_on:
      primary:
        condition: service_healthy

  # The follower, which receives the leader's log through Toxiproxy
  replica:
    image: postgres:17-alpine
    entrypoint: ["sh", "/replica.sh"]
    environment:
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./db/replica.sh:/replica.sh:ro
    depends_on:
      - toxiproxy
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "morada", "-h", "127.0.0.1"]
      interval: 2s
      retries: 60

  # A second replica, which the "promotion" scenario promotes to leader during the
  # partition
  candidate:
    image: postgres:17-alpine
    entrypoint: ["sh", "/candidate.sh"]
    environment:
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./db/candidate.sh:/candidate.sh:ro
    depends_on:
      - toxiproxy
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "morada", "-h", "127.0.0.1"]
      interval: 2s
      retries: 60

  app:
    build: ./node
    image: morada-en-ch27-node
    environment:
      PRIMARY_URL: postgresql://morada:morada@primary:5432/morada
      REPLICA_URL: postgresql://morada:morada@replica:5432/morada
      CANDIDATE_URL: postgresql://morada:morada@candidate:5432/morada
      TOXIPROXY_URL: http://toxiproxy:8474
    volumes:
      - ./output:/data/output
    depends_on:
      replica:
        condition: service_healthy
      candidate:
        condition: service_healthy

  # Compares the output with the approved result
  tools:
    build: ./tools
    volumes:
      - ./:/ch27
    working_dir: /ch27
