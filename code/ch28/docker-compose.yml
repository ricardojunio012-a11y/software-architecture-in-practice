# Chapter 28: concurrency and idempotency.
services:
  # Contested bookings and repeated payments
  app:
    build: ./node
    image: morada-en-ch28-node
    environment:
      DATABASE_URL: postgresql://morada:morada@db:5432/morada
    volumes:
      - ./sql:/data/sql:ro
      - ./output:/data/output
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    # The 20 simultaneous inserts deadlock in chains; checking for deadlocks every
    # 20 ms instead of every second breaks the chains faster than the retries
    # rebuild them
    command: ["postgres", "-c", "deadlock_timeout=20ms"]
    environment:
      POSTGRES_USER: morada
      POSTGRES_PASSWORD: morada
      POSTGRES_DB: morada
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "morada"]
      interval: 2s
      retries: 30

  # Compares the output with the approved result
  tools:
    build: ./tools
    volumes:
      - ./:/ch28
    working_dir: /ch28
