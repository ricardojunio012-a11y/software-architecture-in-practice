# Chapter 16: relational database architecture.
# The language comes from the .env file (LANGUAGE=node|php|python|java).
services:
  # Applies the migrations and runs the query and isolation experiments
  app:
    build: ./${LANGUAGE:-node}
    # One image per language: changing .env does not reuse another language's image
    image: morada-en-ch16-${LANGUAGE:-node}
    environment:
      DATABASE_URL: postgresql://morada:morada@db:5432/morada
    volumes:
      - ./input:/data/input:ro
      - ./migrations:/data/migrations:ro
      - ./output:/data/output
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: morada
      POSTGRES_PASSWORD: morada
      POSTGRES_DB: morada
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "morada"]
      interval: 2s
      retries: 30

  # Compares the output with the approved result
  tools:
    build: ./tools
    volumes:
      - ./:/ch16
    working_dir: /ch16
